services:
  db:
    image: postgres:16
    container_name: book-review-db
    environment:
      POSTGRES_DB: book_review
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

    # DBが本当に使える状態か確認
    # docker ps で healthy / unhealthy 表示される
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # DBが異常停止したら自動再起動
    # 手動 stop した場合は再起動しない
    restart: unless-stopped
  localstack:
    image: localstack/localstack:3.7
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
    volumes:
    # LocalStack の初期化スクリプトと、S3 にアップロードする画像をマウント
      - ./localstack/init:/etc/localstack/init/ready.d
      - ./localstack/images:/images

volumes:
  db-data:
    name: book_review-db-data