reviews:
  get:
    tags:
      - review-controller
    operationId: getReviews
    parameters:
      - name: bookId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/review.yml#/ReviewResponse"

  post:
    tags:
      - review-controller
    operationId: createReview
    parameters:
      - name: bookId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/review.yml#/ReviewRequest"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "../schemas/review.yml#/ReviewResponse"

reviewById:
  get:
    tags:
      - review-controller
    operationId: getReview
    parameters:
      - name: bookId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: reviewId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "../schemas/review.yml#/ReviewResponse"

  patch:
    tags:
      - review-controller
    operationId: updateReview
    parameters:
      - name: bookId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: reviewId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/review.yml#/ReviewRequest"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "../schemas/review.yml#/ReviewResponse"

  delete:
    tags:
      - review-controller
    operationId: deleteReview
    parameters:
      - name: bookId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: reviewId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      "200":
        description: OK