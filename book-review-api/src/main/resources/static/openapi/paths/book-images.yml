images:
  post:
    tags:
      - book-image-controller
    operationId: upload
    parameters:
      - name: bookId
        in: path
        required: true
        schema:
          type: integer
          format: int64

    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - image
            properties:
              image:
                type: string
                format: binary

    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "../schemas/book-image.yml#/BookImageResponse"

imageById:
  delete:
    tags:
      - book-image-controller
    operationId: delete
    parameters:
      - name: bookId
        in: path
        required: true
        schema:
          type: integer
          format: int64

      - name: imageId
        in: path
        required: true
        schema:
          type: integer
          format: int64

    responses:
      "200":
        description: OK
