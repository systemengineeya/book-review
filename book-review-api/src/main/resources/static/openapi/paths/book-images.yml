images:
  post:
    tags:
      - book-image-controller
    operationId: upload
    parameters:
      - $ref: '../parameters/path-parameters.yml#/BookId'

    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - image
            properties:
              image:
                type: string
                format: binary

    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "../schemas/book-image.yml#/BookImageResponse"

imageById:
  delete:
    tags:
      - book-image-controller
    operationId: delete
    parameters:
      - $ref: '../parameters/path-parameters.yml#/BookId'
      - $ref: '../parameters/path-parameters.yml#/ImageId'

    responses:
      "200":
        description: OK
